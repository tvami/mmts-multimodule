daq:
  IdelayStep: '8'
  NChips: '1'
  NEvents: '5000'
  Number_of_events_per_readout: '-1'
  zmqPushPull_port: '8888'
  delayScanData_port: '8889'
  elinks_daq:
    - { name : 'link0', polarity: 1, idcode: 0 }
    - { name : 'link1', polarity: 1, idcode: 1 }
  elinks_trg:
    - { name : 'link0', polarity: 1, idcode: 0 }
    - { name : 'link1', polarity: 1, idcode: 1 }
    - { name : 'link2', polarity: 1, idcode: 2 }
    - { name : 'link3', polarity: 1, idcode: 3 }
  l1a_enables:
    periodic_l1a_A     : '0x1'
    periodic_l1a_B     : '0x0'
    periodic_l1a_C     : '0x0'
    periodic_l1a_D     : '0x0'
    random_l1a         : '0x0'
    external_l1a       : '0x0'
    block_sequencer    : '0x0'
    periodic_ancillary : '0x0'
  l1a_generator_settings: # type can be 'L1A', 'CALIBREQ' or 'DUMP' while 'CALIBL1A' is not handled ; followMode can be DISABLE, A, B, C or D
    - { name : 'A', BX : '0x18', length : '430', type : 'L1A',      prescale : '0xa', followMode : 'DISABLE' } 
    - { name : 'B', BX : '0x20', length : '5',   type : 'CALIBREQ', prescale : '0x1', followMode : 'DISABLE' } 
    - { name : 'C', BX : '0x30', length : '6',   type : 'DUMP',     prescale : '0x2', followMode : 'DISABLE' } 
    - { name : 'D', BX : '0x40', length : '7',   type : 'L1A',      prescale : '0x3', followMode : 'DISABLE' }
  l1a_settings:
    bx_spacing: '0x2b'         #Minimum bx spcing between random or external triggers i.e. here : 43 BX between 2 consecutive L1A (when reading 1 BX per event)
    external_debounce: '0x0'   #flags to indicate if external L1A should be debounced (generally a fine idea)
    length: '0x5'              #number of consequitive L1A to send in case of external trigger; don't know yet if it will have any effect on rand L1A gen
    ext_delay: '0x0'           #8-bit delays for each external L1A input
    log_rand_bx_period: '0x0'  #LOG2(random period) (bigger numbers -> slower trigger rate)
  ancillary_settings:
    bx: '0x10'
    prescale: '0x0'
    length: '10'
global:
  data_push_port: '8888'
  hw_type: LD
  outputDirectory: data
  run_type: default
  serverIP: '10.220.0.109'
roc_s0:
  sc:
    DigitalHalf:
      all:
        L1Offset: 10
        IdleFrame: 0xCCCCCCC
    MasterTdc:
      all:
        GLOBAL_TA_SELECT_GAIN_TOA: 6 #7
        CTRL_IN_SIG_CTDC_P_EN: 0
        CTRL_IN_SIG_CTDC_P_D: 0
        CTRL_IN_REF_CTDC_P_EN: 1
        CTRL_IN_REF_CTDC_P_D: 31
        BIAS_I_CTDC_D: 63
        CTDC_CALIB_FREQUENCY: 2
        GLOBAL_EN_BUFFER_CTDC: 1
        BIAS_FOLLOWER_CAL_P_EN: 1
        BIAS_FOLLOWER_CAL_P_D: 8
        BIAS_CAL_DAC_CTDC_P_EN: 1
        BIAS_CAL_DAC_CTDC_P_D: 2      
        CTRL_IN_SIG_FTDC_P_EN: 0
        CTRL_IN_SIG_FTDC_P_D: 0
        CTRL_IN_REF_FTDC_P_EN: 0
        CTRL_IN_REF_FTDC_P_D: 0
        BIAS_I_FTDC_D: 63
        FTDC_CALIB_FREQUENCY: 2
        GLOBAL_EN_BUFFER_FTDC: 1
        GLOBAL_INIT_DAC_B_CTDC: 0
        GLOBAL_INIT_DAC_B_FTDC: 0
        GLOBAL_FORCE_EN_CLK: 1
      0:
        GLOBAL_LATENCY_TIME: 10
    GlobalAnalog:
      all:
        Delay9: 3
        Delay87: 4
        Delay65: 3
        Delay40: 2
        Gain_conv: 0
        Sw_Rf: 1
        Sw_Cf: 10
        Sw_Cf_comp: 10
        Sw_cd: 4
    ReferenceVoltage:
      all:
        Vbg_1v: 4
        # ExtCtest: 0
        # IntCtest: 0
        # Calib_dac: 0
        Tot_vref: 350
        Toa_vref: 112
      0:
        Inv_vref: 345
        Noinv_vref: 220
      1:
        Inv_vref: 345 #380
        Noinv_vref: 220 #280
    Top:
      all:
        BIAS_I_PLL_D: 63
        EN_HIGH_CAPA: 1
        EN_LOCK_CONTROL: 0
        ERROR_LIMIT_SC: 0
        Phase: 14
    calib:
      1:
        Sel_trigger_toa: 1
        Sel_trigger_tot: 1
      all:
        Dacb: 63
        Sign_dac: 0
    ch:
      36-71:
        Sel_trigger_toa: 1
        Sel_trigger_tot: 1
      all:
        Dacb: 63
        Sign_dac: 0
    cm:
      2,3:
        Sel_trigger_toa: 1
        Sel_trigger_tot: 1
      1,3:
        Dacb: 63
        Sign_dac: 0
      0,2:
        Dacb: 63
        Sign_dac: 0
