daq:
  IdelayStep: '8'
  L1A_A:
    BX: '0x10'
    prescale: '0x0'
  L1A_B:
    BX: '0x100'
    prescale: '0x0'
  L1A_type: AB
  NChips: '3'
  NEvents: '5000'
  L1A_rand:
    log2period: '0x10'
  L1A_minSep: '0x10'
  calib:
    BX_l1a: '0x114'
    BX_req: '0x100'
    l1a_notcalib: '0x1'
  elinks_daq:
     - { name : 'link0', polarity: 0, idcode: 1 }
     - { name : 'link1', polarity: 0, idcode: 0 }
     - { name : 'link6', polarity: 0, idcode: 4 }
     - { name : 'link7', polarity: 1, idcode: 5 }
     - { name : 'link8',  polarity: 1, idcode: 9  }
     - { name : 'link11', polarity: 1, idcode: 8  }
  elinks_trg:
     - { name : 'link0', polarity: 0, idcode: 0 }
     - { name : 'link1', polarity: 1, idcode: 2 }
     - { name : 'link2', polarity: 0, idcode: 3 }
     - { name : 'link3', polarity: 1, idcode: 1 }
     - { name : 'link4', polarity: 0, idcode: 4 }
     - { name : 'link5', polarity: 1, idcode: 6 }
     - { name : 'link6', polarity: 0, idcode: 7 }
     - { name : 'link7', polarity: 1, idcode: 5 }
     - { name : 'link8',  polarity: 0, idcode: 8  }
     - { name : 'link9',  polarity: 1, idcode: 10 }
     - { name : 'link10', polarity: 1, idcode: 11 }
     - { name : 'link11', polarity: 0, idcode: 9  }
  elinks_trg_phase: ##only needed when using external L1A source 
     - { name : 'link0', polarity: 1, idcode: 1 }
  zmqPushPull_port: '8888'
  delayScanData_port: '8889'
global:
  data_push_port: '8888'
  hw_type: LD
  outputDirectory: data
  run_type: default
  serverIP: hexactrl564610
  #serverIP: hexactrl574300
roc_s0:
  sc:
    DigitalHalf:
      all:
        L1Offset: 10
        IdleFrame: 0xCCCCCCC
      # 0: 
      #   IdleFrame: 0xc0c0c0c
      # 1: 
      #   IdleFrame: 0xcfcfcfc
    GlobalAnalog:
      all:
        # Delay9: 1
        # Delay87: 2
        Delay9: 3
        Delay87: 4
        Delay65: 3
        Delay40: 2
        # Neg: 0
        # Pol_adc: 0
    ReferenceVoltage:
      all:
        Vbg_1v: 4
        #ExtCtest: 0
        #IntCtest: 0
        #Calib_dac: 0
      0:
        Inv_vref: 230
        Noinv_vref: 50
      1:
        Inv_vref: 240
        Noinv_vref: 50
      # all:
      #   Tot_vref: 432
      #   Toa_vref: 200
    Top:
      all:
        BIAS_I_PLL_D: 63
        EN_HIGH_CAPA: 1
        EN_LOCK_CONTROL: 0
        ERROR_LIMIT_SC: 0
    calib:
      all:
        Mask_toa: 1
        Mask_tot: 1
    cm:
      all:
        Mask_toa: 1
        Mask_tot: 1
    ch:
      all:
        Mask_toa: 1
        Mask_tot: 1
      # 20:
      #   Probe_pa: 1
      # 50:
      #   Probe_pa: 1
