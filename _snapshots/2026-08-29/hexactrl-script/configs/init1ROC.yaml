daq:
  zmqPushPull_port: 8888
  active_menu : 'randomL1A'
  # trophy v2 :
  elinks_daq:
    - { name : 'link0', polarity: 1, idcode: 0 }
    - { name : 'link1', polarity: 1, idcode: 1 }
  elinks_trg:
    - { name : 'link0', polarity: 1, idcode: 0 }
    - { name : 'link1', polarity: 1, idcode: 1 }
    - { name : 'link2', polarity: 1, idcode: 2 }
    - { name : 'link3', polarity: 1, idcode: 3 }
  menus:
    dummy:
      NEvents: 10000
      NEventsPerPush: 200
    randomL1A:
      NEvents: 10000
      log2_rand_bx_period: 10
      bx_min: 45
    randomL1AplusTPG:
      NEvents: 10000
      log2_rand_bx_period: 10
      bx_min: 45
      trg_fifo_latency: 3
    externalL1A:
      NEvents: 10000
      trg_fifo_latency: 3
      trgphase_fifo_latency: 15
      loopBack: true
      bxCalibExt: 10
      lengthCalibExt: 2
      prescale: 0
    calibAndL1A:
      NEvents: 1000
      bxCalib: 10
      bxL1A: 33
      lengthCalib: 1
      lengthL1A: 1
      prescale: 0
    calibAndL1AplusTPG:
      NEvents: 1000
      bxCalib: 10
      bxL1A: 33
      lengthCalib: 1
      lengthL1A: 1
      prescale: 0
      trg_fifo_latency: 3
    delayScan:
      maxDelay: 512
      delayStep: 1
      idlePattern: '0XACCCCCCC'
      acquireLength: 1000
    marsRndL1A:
      log2_rand_bx_period: 10
      bx_min: 45
client:
  zmqPushPull_port: 8888
  hw_type: LD
  outputDirectory: data
  run_type: default
  serverIP: hexactrl564610
roc_s0:
  sc:
    DigitalHalf:
      0: 
        L1Offset: 10
        IdleFrame: 0xCCCCCCC
        CalibrationSC: 1
        Bx_offset: 2 # This avoids the ROC bug of doing OCR on BCR
      1: 
        L1Offset: 10
        IdleFrame: 0xCCCCCCC
        CalibrationSC: 1
        Bx_offset: 2 # This avoids the ROC bug of doing OCR on BCR
    GlobalAnalog:
      0:
        Delay9: 1
        Delay87: 1
        Delay65: 1
        Delay40: 1
        range_inv: 6
        range_tot: 4
        ##ON_toa: 0
        ##ON_tot: 0
        ##SelExtADC: 1
      1:
        Delay9: 1
        Delay87: 1
        Delay65: 1
        Delay40: 1
        range_inv: 6
        range_tot: 4
        ##ON_toa: 0
        ##ON_tot: 0
        ##SelExtADC: 1
    ReferenceVoltage:
      0:
        Vbg_1v: 3
        Refi: 1
        Inv_vref: 400
        Noinv_vref: 250
        Tot_vref: 700 #432 #500
        Toa_vref: 300 #112 #170
      1:
        Vbg_1v: 3
        Refi: 1
        Inv_vref: 400
        Noinv_vref: 250
        Tot_vref: 700 #432 #500
        Toa_vref: 300 #112 #170
    Top:
      all:
        BIAS_I_PLL_D: 63
        EN_HIGH_CAPA: 1
        #EN_LOCK_CONTROL: 0
        #Pll_Locked_sc: 1
        RunL: 1
        RunR: 1
        #phase_ck: 14
    MasterTdc:
      all:
        #GLOBAL_FORCE_EN_CLK: 0 # 0 by default
        BIAS_I_CTDC_D: 10 # 24 by default
        FOLLOWER_CTDC_EN: 1 # 1 by default
        BIAS_FOLLOWER_CAL_P_CTDC_EN: 1 # 0 by default
        BIAS_FOLLOWER_CAL_P_D: 4 # 0 by default
        GLOBAL_EN_BUFFER_CTDC: 1 # 0 by default
        BIAS_CAL_DAC_CTDC_P_EN: 1 # 0 by default
        BIAS_CAL_DAC_CTDC_P_D: 2 # 0 by default
        BIAS_I_FTDC_D: 10 # 24 by default
        FOLLOWER_FTDC_EN: 1 # 1 by default
        BIAS_FOLLOWER_CAL_P_FTDC_EN: 1 # 0 by default
        BIAS_FOLLOWER_CAL_P_FTDC_D: 4 # 0 by default
        GLOBAL_EN_BUFFER_FTDC: 1 # 0 by default
        CTDC_CALIB_FREQUENCY: 2 # 2 by default
        FTDC_CALIB_FREQUENCY: 2 # 2 by default
